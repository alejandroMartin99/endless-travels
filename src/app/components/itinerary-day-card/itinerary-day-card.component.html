<mat-expansion-panel 
  [id]="panelId || null"
  [(expanded)]="panelOpenState" 
  (opened)="onPanelStateChange(true)" 
  (closed)="onPanelStateChange(false)"
  class="{{ borderClass }}">
  
  <mat-expansion-panel-header>
    <mat-panel-title>
      {{ day.title }}
    </mat-panel-title>
  </mat-expansion-panel-header>

  <!-- Desktop Layout -->
  <div class="desktop-layout">
    <!-- Contenedor de la actividad actual -->
    <div class="activity-container">
      
      <div class="activity-description">
        <h3>{{ day.activities[currentActivityIndex].name }}</h3>
        <p class="description-text" [innerHTML]="day.activities[currentActivityIndex].description"></p>
      </div>

      <div class="activity-image">
        <img [src]="day.activities[currentActivityIndex].images[currentImageIndex]" 
              [alt]="day.activities[currentActivityIndex].name">
        <!-- Controles de imagen -->
        <div class="gallery-controls" *ngIf="day.activities[currentActivityIndex].images.length > 1">
          <button mat-icon-button (click)="changeImage(-1)" [disabled]="currentImageIndex === 0" class="btn">
            <mat-icon>chevron_left</mat-icon>
          </button>
          <button mat-icon-button (click)="changeImage(1)" 
                  [disabled]="currentImageIndex === day.activities[currentActivityIndex].images.length - 1" class="btn">
            <mat-icon>chevron_right</mat-icon>
          </button>
        </div>
        <!-- Contador de imágenes -->
        <div class="desktop-image-counter" *ngIf="day.activities[currentActivityIndex].images.length > 1">
          {{ currentImageIndex + 1 }} / {{ day.activities[currentActivityIndex].images.length }}
        </div>
      </div>
      <div class="activity-map" #map></div>
    </div>

    <!-- Navegación entre actividades -->
    <div class="activity-navigation">
      <div
        *ngFor="let activity of day.activities; let i = index"
        class="activity-indicator"
        [class.active]="i === currentActivityIndex"
        (click)="selectActivity(i)">
      </div>
    </div>

    <!-- Botones de control -->
    <div class="controls-container col-2">
      <div class="carousel-control">
        <button mat-button (click)="changeActivity(-1)" [disabled]="currentActivityIndex === 0">
          Anterior
        </button>
        <button mat-button (click)="changeActivity(1)" 
                [disabled]="currentActivityIndex === day.activities.length - 1">
          Siguiente
        </button>
      </div>
      
      <div class="map-controls-group">
        <button 
          class="rescale-control"
          mat-button
          type="button"
          (click)="rescaleMap()">
          <mat-icon>my_location</mat-icon>
          <span>Centrar</span>
        </button>
        <button 
          class="rescale-control"
          mat-button
          type="button"
          (click)="openGoogleMapsRoute()">
          <mat-icon>map</mat-icon>
          <span>Google Maps</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Layout -->
  <div class="mobile-layout">
    <div class="mobile-map-hero">
      <div class="activity-map" #mobileMap></div>

      <div class="mobile-stage-bar" aria-label="Etapa activa">
        <button
          type="button"
          class="mobile-stage-nav"
          (click)="changeActivity(-1)"
          [disabled]="currentActivityIndex === 0"
          aria-label="Etapa anterior"
        >
          <mat-icon>chevron_left</mat-icon>
        </button>

        <div class="mobile-stage-current">
          <span class="mobile-stage-num">{{ currentActivityIndex + 1 }}</span>
          <span class="mobile-stage-name">{{ day.activities[currentActivityIndex].name }}</span>
        </div>

        <button
          type="button"
          class="mobile-stage-nav"
          (click)="changeActivity(1)"
          [disabled]="currentActivityIndex === day.activities.length - 1"
          aria-label="Etapa siguiente"
        >
          <mat-icon>chevron_right</mat-icon>
        </button>

        <button
          type="button"
          class="mobile-stage-more"
          (click)="openMobileActivityDetail(currentActivityIndex)"
          aria-label="Ver descripción y fotos"
        >
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <div class="mobile-map-actions">
        <button type="button" class="mobile-map-action" (click)="rescaleMap()">
          <mat-icon>my_location</mat-icon>
          <span>Centrar</span>
        </button>
        <button type="button" class="mobile-map-action" (click)="openGoogleMapsRoute()">
          <mat-icon>map</mat-icon>
          <span>Ruta</span>
        </button>
      </div>
    </div>
  </div>

</mat-expansion-panel>
